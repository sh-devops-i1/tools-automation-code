- name: set prompt name
  ansible.builtin.shell: set-prompt elk

- name: copy elastic repo file
  ansible.builtin.template:
    src: elastic.repo
    dest: /etc/yum.repos.d/elastic.repo

- name: install elasticsearch
  ansible.builtin.dnf:
    name: elasticsearch
    state: installed

- name: Start elasticsearch
  ansible.builtin.systemd_service:
    name: elasticsearch
    state: started
    enabled: true
    daemon_reload: true

- name: install Kibana
  ansible.builtin.dnf:
    name: kibana
    state: installed

